name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp verify
      - run: docker compose config -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            **/target/*-reports/**
            integration-tests/target/service-logs/**
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp package -DskipTests
      - name: Dependency and configuration vulnerability scan
        run: docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.65.0 fs --scanners vuln,misconfig,secret --exit-code 1 --severity HIGH,CRITICAL /src
