name: verify
on: [ push, pull_request ]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp clean verify
      - run: python3 scripts/verify-artifacts.py
      - run: docker compose config -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            **/target/*-reports/**
            integration-tests/target/service-logs/**
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp package -DskipTests
      - name: Dependency and configuration vulnerability scan
        run: docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.65.0 fs --scanners vuln,misconfig,secret --exit-code 1 --severity HIGH,CRITICAL /src
      - name: Build representative runtime dependency families
        run: docker compose build order-service customer-bff api-gateway
      - name: Scan resolved JVM and OS packages
        run: |
          for component in order-service customer-bff api-gateway; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/ aquasec/trivy:0.65.0 image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL "fulfillment/$component:local"
          done
