<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fulfillment lab</title>
<style>body{font:16px system-ui;max-width:950px;margin:40px auto;padding:20px;background:#111923;color:#e0e9f4}button,input,select{font:inherit;padding:9px;margin:5px;border-radius:6px}pre{white-space:pre-wrap;border:1px solid #64748b;padding:20px}label{display:inline-block}a{color:#8acaff}</style>
<h1>Order fulfillment lab</h1><p>Payment and shipping are deterministic local simulators. Orders use USD and a single SKU.</p><button id="login">Sign in</button><span id="identity"></span>
<form id="place"><label>SKU <select id="sku"><option>DEMO</option><option>LAST</option><option>EMPTY</option></select></label><label>Quantity <input id="quantity" type="number" min="1" max="100" value="1"></label><label>Payment <select id="payment"></select></label><label>Shipping <select id="shipping"></select></label><button>Place order</button></form>
<button id="list">My orders</button><button id="cancel">Cancel selected order</button><button id="reconnect">Reconnect live updates</button><div id="orders"></div><p id="status" role="status"></p><pre id="progress">Sign in as alice / alice-local-only or bob / bob-local-only.</pre><script src="/app.js"></script></html>
