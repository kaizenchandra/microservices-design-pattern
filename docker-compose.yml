name: fulfillment
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: [ --config=/etc/otelcol-contrib/config.yaml ]
    volumes: [ './infra/otel/collector.yml:/etc/otelcol-contrib/config.yaml:ro' ]
    mem_limit: 128m
    healthcheck:
      test: [ CMD, /otelcol-contrib, validate, --config=/etc/otelcol-contrib/config.yaml ]
      interval: 30s
      timeout: 5s
      retries: 3
  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: [ kafka-data:/var/lib/kafka/data ]
    healthcheck:
      test: [ CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null ]
      interval: 10s
      timeout: 10s
      retries: 20
    mem_limit: 1g
  redis:
    image: redis:8.2.1-alpine
    command: [ redis-server, --appendonly, 'yes' ]
    volumes: [ redis-data:/data ]
    healthcheck:
      test: [ CMD, redis-cli, ping ]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    command: [ start-dev, --import-realm ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-local-admin-only}
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: 'true'
    ports: [ '127.0.0.1:8180:8080' ]
    volumes: [ './infra/keycloak/realm.json:/opt/keycloak/data/import/shop-realm.json:ro' ]
    healthcheck:
      test: [ CMD-SHELL, 'bash -c "exec 3<>/dev/tcp/localhost/9000; printf ''GET /health/ready HTTP/1.0\r\n\r\n'' >&3; cat <&3 | grep UP"' ]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 768m
  order-service-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: order_service
      POSTGRES_USER: order_service
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only}
    volumes: [ order-service-data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ CMD-SHELL, 'pg_isready -U order_service -d order_service' ]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 160m
  inventory-service-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: inventory_service
      POSTGRES_USER: inventory_service
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only}
    volumes: [ inventory-service-data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ CMD-SHELL, 'pg_isready -U inventory_service -d inventory_service' ]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 160m
  payment-service-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: payment_service
      POSTGRES_USER: payment_service
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only}
    volumes: [ payment-service-data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ CMD-SHELL, 'pg_isready -U payment_service -d payment_service' ]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 160m
  shipping-service-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: shipping_service
      POSTGRES_USER: shipping_service
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only}
    volumes: [ shipping-service-data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ CMD-SHELL, 'pg_isready -U shipping_service -d shipping_service' ]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 160m
  order-query-service-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: order_query_service
      POSTGRES_USER: order_query_service
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only}
    volumes: [ order-query-service-data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ CMD-SHELL, 'pg_isready -U order_query_service -d order_query_service' ]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 160m
  provider-simulator-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: provider_simulator
      POSTGRES_USER: provider_simulator
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only}
    volumes: [ provider-simulator-data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ CMD-SHELL, 'pg_isready -U provider_simulator -d provider_simulator' ]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 160m
  order-service:
    build:
      context: .
      args:
        MODULE: order-service
    image: fulfillment/order-service:local
    environment:
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: 'false'
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OIDC_ISSUER: http://localhost:8180/realms/shop
      OIDC_JWKS: http://keycloak:8080/realms/shop/protocol/openid-connect/certs
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PROVIDER_URL: http://provider-simulator:8080
      PROVIDER_KEY: ${PROVIDER_KEY:-local-simulator-only}
      ORDER_URL: http://order-service:8080
      QUERY_URL: http://order-query-service:8080
      FRONTEND_ORIGIN: http://localhost:${GATEWAY_PORT:-8080}
      BFF_URL: http://customer-bff:8080
      REDIS_HOST: redis
      DB_URL: jdbc:postgresql://order-service-db:5432/order_service
      DB_USER: order_service
      DB_PASSWORD: ${DB_PASSWORD:-local-only}
    depends_on:
      keycloak: { condition: service_healthy }
      order-service-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: [ CMD, curl, -fsS, http://localhost:8080/actuator/health/readiness ]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
    mem_limit: 512m
    cpus: 1.0
    read_only: true
    tmpfs: [ /tmp ]
    security_opt: [ no-new-privileges:true ]
    cap_drop: [ ALL ]
    stop_grace_period: 30s
  inventory-service:
