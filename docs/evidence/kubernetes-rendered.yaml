apiVersion: v1
kind: Namespace
metadata:
  name: fulfillment
---
apiVersion: v1
data:
  BFF_URL: http://customer-bff:8080
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  OIDC_ISSUER: https://identity.example.com/realms/shop
  OIDC_JWKS: https://identity.example.com/realms/shop/protocol/openid-connect/certs
  ORDER_URL: http://order-service:8080
  PROVIDER_URL: http://provider-simulator:8080
  QUERY_URL: http://order-query-service:8080
  REDIS_HOST: redis
kind: ConfigMap
metadata:
  name: fulfillment-config
  namespace: fulfillment
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: fulfillment
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app: api-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: customer-bff
  namespace: fulfillment
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app: customer-bff
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: fulfillment
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app: inventory-service
---
apiVersion: v1
kind: Service
metadata:
  name: order-query-service
  namespace: fulfillment
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app: order-query-service
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: fulfillment
spec:
  ports:
  - name: http
    port: 8080
